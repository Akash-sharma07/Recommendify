<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- Bootstrap Icons -->
    <link rel="stylesheet"
        href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">
    
    <link rel="stylesheet"
        href="{{ url_for('static', filename='css/about.css') }}">

    <link rel="stylesheet"
        href="{{ url_for('static', filename='css/home.css') }}">
    
    <link rel="stylesheet"
      href="{{ url_for('static', filename='css/books.css') }}">
    {% block extra_css %}{% endblock %}

    <title>{% block title %}Recommendify{% endblock %}</title>
</head>
<body>
    <header class="header">
            <div class="header-container">

                <div class="logo">
                    <a href="{{ url_for('home') }}">
                        <h1>Recommendify</h1>
                    </a>
                </div>
                
                <nav class="nav-bar">
                    <a href="{{ url_for('home') }}">
                        Home
                    </a>
                    <a href="{{ url_for('books') }}">
                        Books
                    </a>
                    <a href="{{ url_for('movies') }}">
                        Movies
                    </a>
                    <a href="{{ url_for('about') }}">
                        About
                    </a>
                </nav>

                <div class="info">
                    <a href="https://github.com/Akash-sharma07" 
                    target="_blank"
                    rel="noopener noreferrer">
                        <img src="{{ url_for('static', filename='images/github-icon.png')}}" alt="github-icon">
                    </a>

                    <a href="{{ url_for('contact') }}">
                        Contact
                    </a>
                </div>

            </div>
    </header>

    <main>
        {% block content %} {% endblock %}
    </main>

    <footer class="footer">
        <div class="footer-div">

            <p>© 2026 Recommendify. Built by Akash Sharma.</p>
            
            <nav class="footer-nav">
                
                <a href="{{ url_for('about') }}">
                    About
                </a>
                
                <a href="https://github.com/Akash-sharma07"
                target="_blank",
                rel="noopener noreferrer">

                    Github
                </a>
                
                <a href="https://www.linkedin.com/in/akash-sharma8017/"
                target="_blank"
                rel="noopener norefrerer">
                    Linkedin
                </a>

                <a href="{{ url_for('contact') }}">
                    Contact
                </a>
            </nav>
        </div>
    </footer>
</body>
</html>
